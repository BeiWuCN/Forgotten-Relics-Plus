name: Verify Forgotten Relics Plus

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      local_dependencies:
        description: Use a temporary self-hosted runner with local locked dependencies
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ inputs.local_dependencies && fromJSON('["self-hosted", "Windows", "X64", "fr-release"]') || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: libs/*.jar
          key: dependencies-${{ hashFiles('libs/dependencies.lock.json') }}
      - name: Prepare locked dependencies
        env:
          DEPS_BASE_URL: ${{ secrets.DEPS_BASE_URL }}
        shell: pwsh
        run: ./scripts/setup-dependencies.ps1 -Source "$env:FR_DEPS_SOURCE" -Optional:([bool]$env:FR_DEPS_SOURCE)
      - name: Test and validate resources
        run: .\gradlew.bat clean build --console=plain
      - name: Check datagen output
        run: ./scripts/verify-datagen.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            build/reports/tests/
            build/libs/
