## JVM 参数
## ModDevGradle 要解压/重映射整个 Minecraft，内存给足；缓存打开可以显著缩短二次构建。
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
## maven.neoforged.net 在本机网络上会间歇性重置连接，靠重试而不是直接失败。
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=500

## 环境
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.250
neo_version_range=[21.1.250,)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## 模组信息
## mod_id 沿用原版 1.12.2 的 forgotten_relics，方便贴图/模型/语言键/研究直接复用，不用改资源路径。
mod_id=forgotten_relics
mod_name=Forgotten Relics: Unofficial
mod_license=MIT
## 版本号规则：1.<第几波饰品>.<第几个修复版本>。当前 1.4.0 = 第 4 波饰品 + 第 0 个修复版本。
mod_version=1.4.0
mod_group_id=com.beiwu
mod_authors=beiwu, gali2009, ForgottenRelicsTeam
## java.util.Properties 按 ISO-8859-1 读取，中文必须写成 \uXXXX 转义，否则进 mods.toml 是乱码。
mod_description=\u5931\u843D\u9057\u7269\u5B66\uFF08Forgotten Relics\uFF09\u975E\u5B98\u65B9 1.21.1 / NeoForge \u79FB\u690D\u7248\uFF0C\u524D\u7F6E Thaumaturge \u4E0E Curios\u3002

## 依赖版本（仅作记录，实际编译依赖是 libs/ 下的扁平 jar）
thaumaturge_version=0.4.4
curios_version=9.5.1
terrablender_version=4.1.0.8
