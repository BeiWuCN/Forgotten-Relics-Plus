plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id
base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }


    runs {
        client {
            client()

            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay')
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.compileClasspath
}

dependencies {
    compileOnly "org.jspecify:jspecify:1.0.0"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    def lockedDependencies = new groovy.json.JsonSlurper().parse(file('libs/dependencies.lock.json'))
    lockedDependencies.dependencies.each { dependency ->
        def artifact = file("libs/${dependency.file}")
        if (!dependency.optional || artifact.exists()) {
            add(dependency.configuration, files(artifact))
        }
    }
}

tasks.register('verifyDependencies') {
    inputs.file('libs/dependencies.lock.json')
    inputs.files(fileTree('libs') { include '*.jar' })
    doLast {
        def lockedDependencies = new groovy.json.JsonSlurper().parse(file('libs/dependencies.lock.json'))
        def expectedNames = lockedDependencies.dependencies.collect { it.file } as Set
        fileTree('libs').matching { include '*.jar' }.files.each { artifact ->
            if (artifact.name ==~ /(?i)(thaumaturge|curios|botania|patchouli|terrablender|lithostitched|jei)-.*/ && !expectedNames.contains(artifact.name)) {
                throw new GradleException("Unexpected dependency version: ${artifact.name}")
            }
        }
        lockedDependencies.dependencies.each { dependency ->
            def artifact = file("libs/${dependency.file}")
            if (!artifact.exists()) {
                if (!dependency.optional) {
                    throw new GradleException("Missing ${dependency.file}. Run pwsh -File scripts/setup-dependencies.ps1 -Source <directory>.")
                }
            } else {
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                artifact.withInputStream { stream ->
                    byte[] buffer = new byte[65536]
                    int bytes
                    while ((bytes = stream.read(buffer)) != -1) {
                        digest.update(buffer, 0, bytes)
                    }
                }
                if (digest.digest().encodeHex().toString() != dependency.sha256) {
                    throw new GradleException("Dependency checksum mismatch: ${dependency.file}")
                }
            }
        }
    }
}

tasks.named('compileJava') { dependsOn 'verifyDependencies' }

tasks.named('compileJava') {
    options.compilerArgs << '-Xmaxerrs' << '2000'

    options.compilerArgs << '-Xlint:all'
    options.encoding = 'UTF-8'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties

    filteringCharset = 'UTF-8'
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('test') {
    useJUnitPlatform()
}

if (System.getProperty('os.name').toLowerCase().contains('windows') && projectDir.path.any { it > '\u007f' }) {
    def staging = new File(gradle.gradleUserHomeDir,
            "forgotten-relics-plus/test-classpath/${Integer.toHexString(projectDir.path.hashCode())}")
    def originalTestClasspath = sourceSets.test.runtimeClasspath
    def stageTestClasspath = tasks.register('stageTestClasspath', Sync) {
        dependsOn 'testClasses', 'classes'
        into staging
        originalTestClasspath.files.eachWithIndex { artifact, index ->
            if (artifact.path.any { it > '\u007f' }) {
                from(artifact) { into "cp${index}" }
            }
        }
    }
    tasks.named('test') {
        dependsOn stageTestClasspath
        classpath = files(providers.provider {
            originalTestClasspath.files.withIndex().collect { artifact, index ->
                if (artifact.path.any { it > '\u007f' }) {
                    def destination = new File(staging, "cp${index}")
                    artifact.name.endsWith('.jar') ? new File(destination, artifact.name) : destination
                } else {
                    artifact
                }
            }
        })
    }
}
tasks.register('verifyResources', Exec) {
    dependsOn 'jar'
    commandLine 'pwsh', '-NoProfile', '-File', 'scripts/verify-resources.ps1'
}

tasks.named('check') { dependsOn 'verifyResources' }

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
}
